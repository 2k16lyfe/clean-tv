name: Build launcher APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: launcher/debug.keystore
          key: tvhome-signing-key-v1
      - run: bash launcher/build-and-install.sh --build
      - uses: actions/upload-artifact@v4
        with: { name: tvhome-apk, path: launcher/build/tvhome.apk }
      - name: Attach APK to the release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" launcher/build/tvhome.apk --clobber
